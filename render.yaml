# Render blueprint for the TACTIX API. The database is external (Supabase,
# or any Postgres with the pgvector extension); set DATABASE_URL in the dashboard.
services:
  - type: web
    name: tactix-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # postgres:// URL from Supabase (Project settings > Database > Connection string)
      - key: GEMINI_API_KEY
        sync: false # optional; enables Gemini for the pundit, custom plans and Analyst Q&A
      - key: CORS_ORIGINS
        sync: false # your site, e.g. https://tactix.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: AUTO_SEED
        value: "true"
      - key: ENVIRONMENT
        value: production
