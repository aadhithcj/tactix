services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tactix_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tactix
      POSTGRES_PASSWORD: tactix_pass
      POSTGRES_DB: tactix_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tactix -d tactix_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tactix_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+psycopg://tactix:tactix_pass@db:5432/tactix_db
      - ENVIRONMENT=development
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
